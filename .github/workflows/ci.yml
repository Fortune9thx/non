name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contract:
    name: contract — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install genlayer-test genvm-linter Pillow pytest

      - name: Build the deployable bundle
        run: python scripts/build_bundle.py

      - name: Fail if the bundle is stale
        # The bundle is generated, but it is also what gets deployed and
        # reviewed. If rebuilding it changes the committed file, the commit
        # does not contain what it claims to.
        run: git diff --exit-code -- build/Non.bundled.py

      # genvm-lint's validation step needs the py-genlayer runner tarball for
      # the EXACT SDK version pinned in the bundle's Depends header. Left to
      # itself on a cold runner it fetches a default SDK that does not contain
      # that hash and fails with "filename 'runners/py-genlayer/..' not found".
      # `setup -c` auto-detects the version from the contract itself, so this
      # populates the cache with the right one first.
      - name: Cache the GenVM SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/genvm-linter
            ~/.cache/gltest-direct
          key: genvm-${{ runner.os }}-${{ hashFiles('build/Non.bundled.py') }}
          restore-keys: genvm-${{ runner.os }}-

      - name: Fetch the pinned SDK
        run: genvm-lint setup -c build/Non.bundled.py --json

      - name: Lint the bundle
        run: genvm-lint check build/Non.bundled.py

      - name: Pure-logic tests
        run: python -m pytest tests/unit -q

      - name: Direct-mode contract tests
        run: python -m pytest tests/direct -q

  frontend:
    name: frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run build
